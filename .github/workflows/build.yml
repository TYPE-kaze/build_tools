name: Build and Push Docker Image

on:
  # Allows you to trigger this manually from the GitHub website
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: onlyoffice-documentserver-plain:latest
          outputs: type=docker,dest=/tmp/my-image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onlyoffice-documentserver-plain
          path: /tmp/my-image.tar
